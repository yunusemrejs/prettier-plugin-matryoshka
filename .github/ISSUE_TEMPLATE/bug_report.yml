name: Bug report
description: Report a reproducible bug in prettier-plugin-matryoshka.
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal input and config to reproduce the issue.
      placeholder: |
        Input:
        :::vue
        ...
        :::endvue

        .prettierrc:
        { "parser": "matryoshka", "plugins": ["prettier-plugin-matryoshka"] }
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node, Prettier, plugin versions.
      placeholder: node 20.x, prettier 3.x, prettier-plugin-matryoshka 0.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include logs, especially with matryoshkaLogLevel=debug.
      render: shell
